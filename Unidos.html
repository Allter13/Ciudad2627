<html>
  <head>
    <meta charset="utf-8">
    <title>Ciudad</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>


      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
        <a-asset-item id="robot" src="CiudadFi.glb"></a-asset-item>
      </a-assets>

      <!-- Robot 3D -->
      <a-entity gltf-model="#robot" position="0 0 -3" scale="300 300 300" rotation="90 0 0"></a-entity>
      
      <!-- Cielo -->
      <a-sky color="#87CEEB"></a-sky>
       

    </a-scene>
  </body>
</html>
